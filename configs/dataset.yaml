# PCB Defect Detection - Dataset Configuration
# Compatible with YOLOv8 (Ultralytics)

path: ../data/splits          # Root dataset directory
train: train/images
val: val/images
test: test/images

# Number of classes
nc: 6

# Class names (DeepPCB defect types)
names:
  0: missing_hole
  1: mouse_bite
  2: open_circuit
  3: short
  4: spur
  5: spurious_copper
